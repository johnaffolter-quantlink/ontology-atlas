<meta charset="utf-8">
<title>Atlas Current</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
  /* Single deliberate look: graphite instrument, indigo current, paper for documents. */
  :root {
    color-scheme: dark;
    --ground: #0a0a0a;
    --panel: #111111;
    --raised: #191919;
    --line: #1f1f1f;
    --line-2: #2c2c2c;
    --t1: #fafafa;
    --t2: #d4d4d4;
    --t3: #8f8f8f;
    --t4: #5e5e5e;
    --current: #e8e8e8;
    --current-hot: #ffffff;
    --current-a: rgba(255, 255, 255, 0.12);
    --touched: #e8e6d9;
    --paper: #f5f5f2;
    --ink: #1c1d20;
    --ink-2: #555861;
    --ink-rule: #dcdcd6;
    --ink-accent: #1c1d20;
    /* kinds of work, read from each commit's conventional prefix */
    --w-build: #fafafa;
    --w-repair: #bdbdbd;
    --w-plan: #8f8f8f;
    --w-tend: #5e5e5e;
    --sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --serif: "Source Serif 4", "Iowan Old Style", Georgia, "Times New Roman", serif;
  }
  :root[data-theme="light"], :root[data-theme="dark"] { color-scheme: dark; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--ground); color: var(--t2); font-family: var(--sans); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow: hidden; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--current); outline-offset: 2px; }
  .mono { font-family: var(--mono); }

  .app { position: relative; height: 100%; display: grid; grid-template-rows: auto 1fr auto; }

  /* ---------- top bar ---------- */
  .bar { display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap; padding-block: 12px; padding-inline: 16px; border-bottom: 1px solid var(--line); background: var(--ground); position: relative; z-index: 3; }
  .brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .brand h1 { margin: 0; font-size: 15px; font-weight: 600; color: var(--t1); letter-spacing: -0.01em; }
  .brand .sub { font-family: var(--mono); font-size: 11px; color: var(--t4); letter-spacing: 0.04em; white-space: nowrap; }
  .find { margin-left: auto; position: relative; }
  .find input { width: 240px; max-width: 52vw; background: var(--panel); border: 1px solid var(--line-2); border-radius: 7px; padding: 6px 10px 6px 28px; font-size: 13px; }
  .find input::placeholder { color: var(--t4); }
  .find svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); width: 13px; height: 13px; stroke: var(--t3); }
  .legend { display: flex; gap: 14px; font-size: 11px; color: var(--t3); font-family: var(--mono); letter-spacing: 0.02em; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .legend i { display: inline-block; width: 14px; height: 2px; background: var(--t4); border-radius: 1px; }
  .legend i.dep { background: var(--current); }
  .legend i.pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--current-hot); box-shadow: 0 0 8px 2px var(--current); }

  /* ---------- stage ---------- */
  .stage { position: relative; overflow: hidden; background: radial-gradient(120% 95% at 50% 42%, #121212 0%, #0c0c0c 58%, var(--ground) 100%); touch-action: none; }
  .stage canvas#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
  .stage canvas#map.dragging { cursor: grabbing; }
  .stage canvas#map.over { cursor: pointer; }
  .hint { position: absolute; left: 16px; bottom: 12px; font-family: var(--mono); font-size: 11px; color: var(--t4); pointer-events: none; letter-spacing: 0.02em; }

  /* ---------- node popover ---------- */
  .pop { position: absolute; z-index: 4; width: 384px; max-width: calc(100% - 32px); background: rgba(15, 16, 17, 0.94); backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2);
    border: 1px solid var(--line-2); border-radius: 12px; box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 24px 60px -12px rgba(0,0,0,0.7), 0 0 0 1px rgba(0,0,0,0.4);
    transform-origin: var(--ox, 0) var(--oy, 0); animation: pop-in 220ms cubic-bezier(.2,.9,.25,1.05); }
  @keyframes pop-in { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: none; } }
  .pop header { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
  .kind { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--t3); }
  .kind b { width: 7px; height: 7px; border-radius: 50%; background: var(--t2); display: inline-block; }
  .kind b.domain { background: transparent; border: 1.5px solid var(--t1); }
  .kind b.element { background: var(--t3); border-radius: 1.5px; }
  .pop h2 { margin: 4px 0 2px; font-size: 17px; font-weight: 600; color: var(--t1); letter-spacing: -0.01em; text-wrap: balance; }
  .pop .path { font-family: var(--mono); font-size: 11px; color: var(--t3); overflow-wrap: anywhere; }
  .pop .rev { font-size: 11.5px; color: var(--t4); margin-top: 4px; }
  .pop .rev .mono { color: var(--t3); }
  .close { position: absolute; right: 8px; top: 8px; width: 28px; height: 28px; border-radius: 6px; border: 0; background: transparent; color: var(--t3); cursor: pointer; display: grid; place-items: center; }
  .close:hover { background: var(--raised); color: var(--t1); }

  .tabs { display: flex; gap: 2px; padding: 8px 12px 0; }
  .tab { border: 0; background: transparent; color: var(--t3); padding: 6px 10px; border-radius: 6px 6px 0 0; cursor: pointer; font-size: 12.5px; display: inline-flex; gap: 6px; align-items: center; border-bottom: 1.5px solid transparent; }
  .tab:hover { color: var(--t1); }
  .tab[aria-selected="true"] { color: var(--t1); border-bottom-color: var(--current); }
  .tab .n { font-family: var(--mono); font-size: 10.5px; color: var(--t4); }
  .tabbody { padding: 10px 12px 12px; }
  .pop footer { display: flex; gap: 8px; padding: 0 12px 12px; }
  .btn { border: 1px solid var(--line-2); background: var(--raised); color: var(--t1); border-radius: 7px; padding: 6px 11px; font-size: 12.5px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
  .btn:hover { border-color: #3a3b42; background: #1c1d21; }
  .btn.primary { background: var(--t1); border-color: var(--t1); color: var(--ground); font-weight: 500; }
  .btn.primary:hover { background: #ffffff; }
  .btn.icon { padding: 6px 8px; }
  .btn svg { width: 13px; height: 13px; }
  .grow { flex: 1; }

  /* thumbnails: real layouts rendered at full size, then scaled into the frame */
  .frame { position: relative; overflow: hidden; border-radius: 6px; background: #0b0c0d; }
  .scaler { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .frame.paperframe { height: 292px; background: #d8d8d2; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.3); }
  .frame.paperframe::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 56px; background: linear-gradient(to bottom, rgba(245,245,242,0), var(--paper)); pointer-events: none; }
  .frame.slideframe { aspect-ratio: 16 / 9; box-shadow: inset 0 0 0 1px var(--line-2); }
  .strip { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .ctl { width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--raised); color: var(--t1); display: grid; place-items: center; cursor: pointer; flex: none; }
  .ctl:hover { background: #1c1d21; }
  .ctl svg { width: 12px; height: 12px; }
  .count { font-family: var(--mono); font-size: 11px; color: var(--t3); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .dots { display: flex; gap: 4px; flex: 1; justify-content: center; flex-wrap: wrap; }
  .dots i { width: 14px; height: 3px; border-radius: 2px; background: var(--line-2); cursor: pointer; }
  .dots i.on { background: var(--current); }

  /* video-style replay */
  .player { position: relative; }
  .player canvas { width: 100%; aspect-ratio: 16 / 9; display: block; border-radius: 6px; background: #0b0c0d; box-shadow: inset 0 0 0 1px var(--line-2); }
  .scrub { position: relative; flex: 1; height: 28px; cursor: pointer; touch-action: none; }
  .scrub .track { position: absolute; left: 0; right: 0; top: 13px; height: 3px; border-radius: 2px; background: var(--line-2); }
  .scrub .fill { position: absolute; left: 0; top: 13px; height: 3px; border-radius: 2px; background: var(--current); }
  .scrub .knob { position: absolute; top: 9px; width: 11px; height: 11px; margin-left: -5.5px; border-radius: 50%; background: var(--t1); box-shadow: 0 0 0 3px rgba(255,255,255,0.14); }
  .scrub .tick { position: absolute; top: 10px; width: 1px; height: 9px; background: var(--t4); }
  .chapter { font-size: 12px; color: var(--t2); margin-top: 6px; min-height: 18px; }
  .chapter .mono { color: var(--t3); font-size: 11px; }

  .empty { font-size: 12.5px; color: var(--t3); padding: 18px 4px; }

  /* ---------- paper documents ---------- */
  .paper { width: 640px; background: var(--paper); color: var(--ink); font-family: var(--serif); font-size: 15px; line-height: 1.58; padding: 44px 56px 52px; box-sizing: border-box; font-optical-sizing: auto; }
  .paper .lh { display: flex; justify-content: space-between; gap: 16px; font-family: var(--sans); font-size: 10.5px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-2); border-bottom: 1px solid var(--ink); padding-bottom: 8px; }
  .paper .lh span:last-child { font-family: var(--mono); text-transform: none; letter-spacing: 0; }
  .paper h1 { font-family: var(--serif); font-weight: 600; font-size: 30px; line-height: 1.15; letter-spacing: -0.01em; margin: 26px 0 10px; text-wrap: balance; }
  .paper .standfirst { font-size: 17.5px; line-height: 1.5; color: #2c2e33; margin: 0 0 18px; }
  .paper dl.meta { display: grid; grid-template-columns: 128px 1fr; gap: 4px 14px; margin: 0 0 20px; padding: 12px 0; border-top: 1px solid var(--ink-rule); border-bottom: 1px solid var(--ink-rule); font-family: var(--sans); font-size: 11.5px; }
  .paper dt { color: var(--ink-2); letter-spacing: 0.02em; }
  .paper dd { margin: 0; font-family: var(--mono); font-size: 11px; overflow-wrap: anywhere; color: var(--ink); }
  .paper h3 { font-family: var(--sans); font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink-accent); margin: 22px 0 6px; font-weight: 600; }
  .paper p { margin: 0 0 10px; }
  .paper ul { margin: 0 0 10px; padding-left: 20px; }
  .paper li { margin: 0 0 5px; }
  .paper li::marker { color: var(--ink-2); }
  .paper code { font-family: var(--mono); font-size: 0.8em; background: #e9e9e3; padding: 1px 4px; border-radius: 3px; }
  .paper .notes { margin-top: 22px; border-top: 1px solid var(--ink-rule); padding-top: 10px; font-size: 13px; color: #34363c; }
  .paper .notes ol { padding-left: 18px; margin: 6px 0 0; }
  .paper .notes li { margin-bottom: 8px; }
  .paper .notes .to { font-family: var(--mono); font-size: 11px; color: var(--ink-accent); display: block; }
  .paper .folio { margin-top: 26px; display: flex; justify-content: space-between; font-family: var(--mono); font-size: 10px; color: var(--ink-2); border-top: 1px solid var(--ink-rule); padding-top: 8px; }

  /* ---------- slides (960 × 540) ---------- */
  .slide { width: 960px; height: 540px; box-sizing: border-box; padding: 54px 64px 46px; background: radial-gradient(130% 120% at 0% 0%, #1a1a1a 0%, #121212 55%, #0d0d0d 100%); color: var(--t2); font-family: var(--sans); position: relative; display: flex; flex-direction: column; }
  .slide .kick { font-family: var(--mono); font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--t3); }
  .slide h3 { font-size: 44px; line-height: 1.08; font-weight: 600; letter-spacing: -0.025em; color: var(--t1); margin: 14px 0 16px; text-wrap: balance; max-width: 780px; }
  .slide h3.xl { font-size: 64px; }
  .slide p.lead { font-size: 21px; line-height: 1.45; color: var(--t2); max-width: 720px; margin: 0; }
  .slide .stats { display: flex; gap: 48px; margin-top: auto; }
  .slide .stat b { display: block; font-size: 40px; font-weight: 500; color: var(--t1); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .slide .stat span { font-family: var(--mono); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--t3); }
  .slide .cols { display: grid; grid-template-columns: 1.35fr 1fr; gap: 44px; flex: 1; min-height: 0; }
  .slide ul.inc { margin: 6px 0 0; padding: 0; list-style: none; display: grid; gap: 12px; }
  .slide ul.inc li { font-size: 18px; line-height: 1.4; color: var(--t2); padding-left: 22px; position: relative; }
  .slide ul.inc li::before { content: ""; position: absolute; left: 0; top: 0.62em; width: 10px; height: 1.5px; background: var(--t1); }
  .slide .side h4 { font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--t3); margin: 0 0 10px; font-weight: 500; }
  .slide .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 26px; }
  .slide .chip { border: 1px solid var(--line-2); background: #161616; border-radius: 6px; padding: 5px 10px; font-size: 14px; color: var(--t2); }
  .slide .chip.dep { border-style: dashed; border-color: #4a4a4a; color: var(--t1); }
  .slide .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 8px; }
  .slide .card { border: 1px solid var(--line-2); border-radius: 8px; padding: 14px 16px; background: rgba(255,255,255,0.015); }
  .slide .card b { display: block; color: var(--t1); font-weight: 500; font-size: 16px; margin-bottom: 4px; }
  .slide .card span { font-size: 13px; line-height: 1.4; color: var(--t3); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .slide .foot { position: absolute; left: 64px; right: 64px; bottom: 22px; display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11px; color: var(--t4); letter-spacing: 0.03em; }
  .slide .commits { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .slide .commits li { font-size: 15px; color: var(--t2); display: grid; grid-template-columns: 92px 1fr; gap: 12px; }
  .slide .commits li .mono { color: var(--t3); font-size: 12.5px; padding-top: 2px; }

  /* ---------- history transport ---------- */
  .transport { border-top: 1px solid var(--line); background: var(--panel); padding-block: 10px 12px; padding-inline: 16px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: auto 1fr auto; gap: 6px 14px; align-items: center; position: relative; z-index: 3; }
  .transport .play { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--t1); background: var(--t1); display: grid; place-items: center; cursor: pointer; grid-row: span 2; }
  .transport .play:hover { background: #ffffff; }
  .transport .play svg { width: 13px; height: 13px; fill: var(--ground); }
  .caption { display: flex; gap: 6px 12px; align-items: baseline; flex-wrap: wrap; min-width: 0; min-height: 20px; font-size: 13px; }
  .caption .h { font-family: var(--mono); font-size: 11.5px; color: var(--t1); }
  .caption .d { font-family: var(--mono); font-size: 11.5px; color: var(--t3); }
  .caption .s { color: var(--t1); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1 1 260px; }
  .caption .n { font-family: var(--mono); font-size: 11.5px; color: var(--t3); white-space: nowrap; }
  .timeline { position: relative; height: 26px; cursor: pointer; touch-action: none; }
  .timeline .axis { position: absolute; left: 0; right: 0; top: 12px; height: 1px; background: var(--line-2); }
  .timeline .t { position: absolute; bottom: 8px; width: 3px; margin-left: -1.5px; border-radius: 1px; background: var(--t4); transition: background 160ms; }
  .timeline .t.done { background: #6a6a6a; }
  .timeline .t.cur { background: #ffffff; box-shadow: 0 0 8px 1px rgba(255,255,255,0.5); }
  .timeline .lab { position: absolute; bottom: -5px; font-family: var(--mono); font-size: 9.5px; color: var(--t4); transform: translateX(-50%); white-space: nowrap; }


  /* view switch, speed, work-type legend */
  .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; padding: 2px; background: var(--panel); gap: 2px; }
  .seg button { border: 0; background: transparent; color: var(--t3); padding: 4px 11px; border-radius: 6px; font-size: 12.5px; cursor: pointer; }
  .seg button:hover { color: var(--t1); }
  .seg button[aria-pressed="true"] { background: var(--raised); color: var(--t1); box-shadow: inset 0 0 0 1px var(--line-2); }
  .speed { grid-row: span 2; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .speed .seg button { font-family: var(--mono); font-size: 11px; padding: 3px 8px; }
  .speed small { font-family: var(--mono); font-size: 10px; color: var(--t4); letter-spacing: 0.04em; }
  .types { position: absolute; right: 16px; top: 12px; display: flex; flex-wrap: wrap; gap: 6px 14px; font-family: var(--mono); font-size: 11px; color: var(--t3); pointer-events: none; }
  .types span { display: inline-flex; align-items: center; gap: 6px; }
  .types i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
  .caption .ty { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; border: 1px solid currentColor; }
  .caption .gap { font-family: var(--mono); font-size: 11px; color: var(--t4); white-space: nowrap; }

  /* ---------- stage toolrow: navigation, lens, filters ---------- */
  .toolrow { position: absolute; left: 12px; right: 12px; top: 10px; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px 12px; flex-wrap: wrap; pointer-events: none; z-index: 3; }
  .toolrow > * { pointer-events: auto; }
  .stage.has-drawer .toolrow { left: 356px; }
  .stage.has-drawer .hint { left: 360px; }
  @media (max-width: 640px) { .stage.has-drawer .toolrow, .stage.has-drawer .hint { left: 12px; } }
  .navc { display: flex; align-items: center; gap: 6px; min-width: 0; flex-wrap: wrap; }
  .iconbtn { width: 28px; height: 28px; border-radius: 7px; border: 1px solid var(--line-2); background: rgba(17,17,17,0.88); color: var(--t2); display: grid; place-items: center; cursor: pointer; flex: none; }
  .iconbtn:hover:not(:disabled) { color: var(--t1); border-color: #3c3c3c; }
  .iconbtn:disabled { opacity: 0.35; cursor: default; }
  .iconbtn svg { width: 12px; height: 12px; }
  .crumbs { display: flex; gap: 0; align-items: center; font-size: 12px; min-width: 0; }
  .crumbs button { border: 0; background: transparent; color: var(--t3); padding: 3px 6px; border-radius: 5px; cursor: pointer; white-space: nowrap; max-width: 150px; overflow: hidden; text-overflow: ellipsis; font-size: 12px; }
  .crumbs button:hover { color: var(--t1); background: var(--raised); }
  .crumbs button[aria-current="true"] { color: var(--t1); }
  .crumbs .sep { color: var(--t4); font-size: 11px; }
  .chipx { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); background: rgba(17,17,17,0.92); border-radius: 999px; padding: 3px 4px 3px 11px; font-size: 12px; color: var(--t3); max-width: 100%; }
  .chipx b { font-weight: 500; color: var(--t1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
  .chipx button { border: 0; background: var(--raised); color: var(--t2); border-radius: 999px; padding: 2px 8px; cursor: pointer; font-size: 11.5px; font-family: var(--mono); }
  .chipx button:hover { color: var(--t1); }
  .chipx button[aria-pressed="true"] { background: var(--t1); color: var(--ground); }
  .rightc { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .filters { display: flex; gap: 4px; flex-wrap: wrap; }
  .filters button { border: 1px solid var(--line-2); background: rgba(17,17,17,0.88); color: var(--t4); border-radius: 6px; padding: 4px 9px; font-size: 11.5px; cursor: pointer; display: inline-flex; gap: 7px; align-items: center; }
  .filters button[aria-pressed="true"] { color: var(--t1); border-color: #3c3c3c; }
  .glyph { display: inline-block; flex: none; }
  .glyph.dom { width: 8px; height: 8px; border: 1.5px solid currentColor; border-radius: 50%; }
  .glyph.cap { width: 7px; height: 7px; background: currentColor; border-radius: 50%; }
  .glyph.el { width: 6px; height: 6px; background: currentColor; border-radius: 1px; }
  .glyph.c { width: 14px; height: 0; border-top: 1px solid currentColor; }
  .glyph.d { width: 14px; height: 0; border-top: 1px dashed currentColor; }
  .types { position: static; }
  .mini { position: absolute; right: 12px; bottom: 12px; width: 184px; height: 116px; border: 1px solid var(--line-2); border-radius: 8px; background: rgba(12,12,12,0.9); cursor: crosshair; z-index: 3; touch-action: none; }

  /* ---------- drawers: review and build ---------- */

  .drawer > header h2 { margin: 3px 0 0; font-size: 15px; font-weight: 600; color: var(--t1); }
  .drawer > header p { margin: 4px 0 0; font-size: 12px; color: var(--t3); }
  .dbody { overflow: auto; padding: 14px 16px 20px; display: grid; gap: 20px; align-content: start; }

  .kpi { background: var(--panel); padding: 10px 12px 11px; }

  .dsec h3 { margin: 0 0 8px; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--t3); font-weight: 500; }
  .dsec p.m { margin: 0 0 8px; font-size: 12px; color: var(--t4); line-height: 1.5; }
  .rows { display: grid; gap: 2px; }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 8px 10px; border-radius: 7px; cursor: pointer; border: 1px solid transparent; background: transparent; text-align: left; color: inherit; width: 100%; }
  .row:hover { background: var(--raised); border-color: var(--line-2); }

  .row .sub { grid-column: 1 / -1; font-family: var(--mono); font-size: 10.5px; color: var(--t4); overflow-wrap: anywhere; }
  .bar1 { height: 3px; border-radius: 2px; background: var(--line-2); grid-column: 1 / -1; overflow: hidden; }
  .bar1 i { display: block; height: 100%; background: var(--t2); }
  .field { display: grid; gap: 5px; }

  .field input, .field select, .field textarea { background: var(--panel); border: 1px solid var(--line-2); border-radius: 7px; padding: 7px 9px; font-size: 13px; color: var(--t1); width: 100%; box-sizing: border-box; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: #4a4a4a; outline: none; }
  .field textarea { resize: vertical; min-height: 58px; font-family: var(--sans); line-height: 1.45; }
  .checks { max-height: 128px; overflow: auto; border: 1px solid var(--line-2); border-radius: 7px; padding: 4px; display: grid; gap: 1px; }
  .checks label { display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--t2); padding: 4px 6px; border-radius: 5px; cursor: pointer; }

  .verdicts { display: grid; gap: 5px; font-size: 12px; }

  .verdicts .no, .verdicts .no i { color: var(--t4); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }

  .exported { width: 100%; min-height: 160px; background: var(--panel); border: 1px solid var(--line-2); border-radius: 7px; color: var(--t2); font-family: var(--mono); font-size: 11px; padding: 8px; box-sizing: border-box; }
  .example { font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--t4); border: 1px dashed var(--line-2); border-radius: 4px; padding: 1px 6px; }

  /* ---------- trace: specs, rendered specs, chains, decision matrix ---------- */
  .spec { font-family: var(--mono); font-size: 11px; line-height: 1.55; color: var(--t2); background: var(--panel); border: 1px solid var(--line-2); border-radius: 7px; padding: 10px 12px; margin: 0; max-height: 300px; overflow: auto; white-space: pre; }

  .jr { display: grid; gap: 8px; font-size: 12px; }

  .chain { display: grid; gap: 10px; }

  .ctrls { display: grid; gap: 1px; max-height: 260px; overflow: auto; }

  .ctrls div:hover { background: var(--raised); }
  .ctrls .mono { font-size: 10.5px; color: var(--t4); }
  .flist { display: grid; gap: 2px; font-family: var(--mono); font-size: 11px; color: var(--t3); }
  .mx { width: 100%; border-collapse: collapse; font-size: 11.5px; }
  .mx th { font-family: var(--mono); font-weight: 500; font-size: 10px; letter-spacing: 0.04em; color: var(--t3); text-align: left; padding: 6px 6px; border-bottom: 1px solid var(--line-2); vertical-align: bottom; }
  .mx td { padding: 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .mx td.rh { color: var(--t1); font-weight: 500; }
  .mx .cell { display: grid; gap: 2px; }
  .mx .door { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.04em; }
  .mx .door.one { color: var(--t1); } .mx .door.two { color: var(--t3); }
  .mx .rv { font-family: var(--mono); font-size: 10px; color: var(--t4); }
  .mxwrap { border: 1px solid var(--line-2); border-radius: 8px; }
  .mx { table-layout: fixed; }
  .mx th:first-child, .mx td:first-child { width: 20%; }
  .mx td, .mx th { overflow-wrap: anywhere; }
  .pop .tabbody { max-height: min(56vh, 480px); overflow: auto; }
  .drawer.wide { width: 560px; }
  @media (max-width: 640px) { .drawer.wide { width: 100%; } }


  /* real source listing */
  .codecard { display: grid; gap: 10px; font-size: 12px; min-width: 0; grid-template-columns: minmax(0, 1fr); }
  .codecard > *, .cgr > *, .cg-cols > * { min-width: 0; }
  .cg-cols { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) !important; }
  .codecard header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
  .codecard .fpath { color: var(--t1); font-size: 12px; word-break: break-all; }
  .codecard .fmeta, .codecard .via { color: var(--t4); font-size: 11px; }
  .exports { display: flex; flex-wrap: wrap; gap: 4px; }
  .ex { font-family: var(--mono); font-size: 11px; color: var(--t2); border: 1px solid var(--line-2); border-radius: 5px; padding: 1px 6px; }

  .listing { background: #0a0a0a; border: 1px solid var(--line-2); border-radius: 8px; padding: 8px 0; overflow: auto; max-height: 340px; font: 11.5px/1.55 var(--mono); box-shadow: inset 0 1px 0 rgba(255,255,255,0.03); }
  .codecard.big .listing { max-height: none; }
  .ln { display: grid; grid-template-columns: 44px 1fr; white-space: pre; }

  .ln .k { color: #fafafa; font-weight: 500; } .ln .s { color: #a3a3a3; } .ln .c { color: #6b6b6b; font-style: italic; }
  .listing .gap { color: #4a4a4a; padding: 2px 0 2px 30px; }

  .cm { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: baseline; padding: 3px 0; border-bottom: 1px solid var(--line); color: var(--t2); }
  .cm .mono { color: var(--t3); font-size: 11px; } .cm time { color: var(--t4); font-family: var(--mono); font-size: 10.5px; }
  .tf { font-size: 11px; color: var(--t2); padding: 2px 0; word-break: break-all; }

  .cgr { border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 10px; }
  .cgr h4 { margin: 0; font: 500 10.5px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--t3); display: flex; justify-content: space-between; gap: 8px; }
  .cgr h4 span { text-transform: none; letter-spacing: 0; color: var(--t4); }
  .cgr h5 { margin: 0 0 5px; font: 500 11px var(--sans); color: var(--t3); }
  .cg-kpis { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 11.5px; color: var(--t3); }
  .cg-kpis b { color: var(--t1); font-weight: 500; font-variant-numeric: tabular-nums; }
  .cg-defs { display: flex; flex-wrap: wrap; gap: 4px; }
  .cg-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .cg-row .mono { font-size: 10.5px; color: var(--t3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cg-row .sub { font-size: 11px; color: var(--t4); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cg-n { margin-left: auto; font-family: var(--mono); font-size: 10.5px; color: var(--t3); }
  .cg-warn { border: 1px dashed #4a4a4a; border-radius: 8px; padding: 8px 10px; }

  .conn { border: 1px solid var(--line-2); border-radius: 9px; padding: 10px 12px; margin: 0 0 10px; display: grid; gap: 8px; }
  .conn h4 { margin: 0; font: 500 10.5px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--t3); display: flex; justify-content: space-between; }
  .conn h4 span { text-transform: none; letter-spacing: 0; color: var(--t4); }
  .conn-row { display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: start; }

  .conn-row time { font: 10.5px var(--mono); color: var(--t4); }
  .conn-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; background: #3a3a3a; box-shadow: 0 0 0 1px #4a4a4a inset; }
  .conn-dot.up { background: #fafafa; } .conn-dot.warn { background: #8f8f8f; } .conn-dot.down { background: transparent; box-shadow: 0 0 0 1.5px #8f8f8f inset; }

  .timeline .t.code { bottom: auto; top: 14px; background: #4a4a4a; width: 2px; margin-left: -1px; }
  .timeline .t.code.cur { background: #fafafa; box-shadow: 0 0 8px 1px rgba(255,255,255,0.45); }
  .sembox { position: fixed; z-index: 30; width: 380px; max-width: calc(100vw - 16px); background: #0d0d0d; border: 1px solid var(--line-2); border-radius: 10px; padding: 6px; box-shadow: 0 18px 50px -12px rgba(0,0,0,0.8); display: grid; gap: 2px; }

  .sembox small { display: block; font-size: 11.5px; color: var(--t3); line-height: 1.4; }

  /* live layer: people, channels, agents */

<script>

// ---------------------------------------------------------------- graph model
const nodes = D.nodes.map(n => ({ ...n, en: 0, touch: 0 }));
const byId = new Map(nodes.map(n => [n.s, n]));
const edges = D.edges.map((e, i) => ({ ...e, i, A: byId.get(e.a), B: byId.get(e.b), en: 0 }));

const dependsOn = n => incident.get(n).filter(e => e.y === 'd' && e.A === n).map(e => e.B);

// Parse a vault page body into its standfirst and sections.
function parseBody(body) {

const stage = $('#stage'), canvas = $('#map'), ctx = canvas.getContext('2d');

const cam = { k: 1, x: 0, y: 0 };

      const p = at(e, rev ? 1 - ease : ease, c), q = at(e, rev ? 1 - Math.max(0, ease - 0.3) : Math.max(0, ease - 0.3), c);
      const grad = g.createLinearGradient(X(q.x), Y(q.y), X(p.x), Y(p.y));
      grad.addColorStop(0, 'rgba(113,112,255,0)'); grad.addColorStop(1, 'rgba(200,199,255,0.9)');
      g.strokeStyle = grad; g.lineWidth = 2.4; g.beginPath(); g.moveTo(X(q.x), Y(q.y)); g.lineTo(X(p.x), Y(p.y)); g.stroke();
      const rg = g.createRadialGradient(X(p.x), Y(p.y), 0, X(p.x), Y(p.y), 10);
      rg.addColorStop(0, 'rgba(240,240,255,0.95)'); rg.addColorStop(1, 'rgba(113,112,255,0)');
      g.fillStyle = rg; g.beginPath(); g.arc(X(p.x), Y(p.y), 10, 0, Math.PI * 2); g.fill();
    }
    g.restore();
    g.textAlign = 'center';
    for (const n of this.set) {
      const a = arrive(n), since = t - a, reached = since >= 0;
      const x = X(n.x), y = Y(n.y), r = n.k === 'domain' ? 8 : n.k === 'capability' ? 5 : 3;
      if (reached && since < 1200) {
        const glow = 1 - since / 1200;
        g.save(); g.globalCompositeOperation = 'lighter';
        const rg = g.createRadialGradient(x, y, r * 0.5, x, y, r + 22 * glow + 4);
        rg.addColorStop(0, `rgba(170,168,255,${0.7 * glow})`); rg.addColorStop(1, 'rgba(113,112,255,0)');
        g.fillStyle = rg; g.beginPath(); g.arc(x, y, r + 22 * glow + 4, 0, Math.PI * 2); g.fill(); g.restore();
      }
      g.globalAlpha = reached ? 1 : 0.22;
      g.fillStyle = reached ? (n === this.src ? '#f7f8f8' : '#c9c8ff') : '#62666d';
      if (n.k === 'element') g.fillRect(x - r, y - r, r * 2, r * 2); else { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); }
      if (n === this.src) { g.strokeStyle = '#f7f8f8'; g.lineWidth = 1.2; g.beginPath(); g.arc(x, y, r + 5, 0, Math.PI * 2); g.stroke(); }
      const hh = this.r.hop.get(n);
      if (reached && (hh <= 1 || this.set.length < 18) && w > 300) {
        g.font = `${n === this.src ? 600 : 500} ${w > 600 ? 12 : 10.5}px Geist, system-ui, sans-serif`;
        g.lineWidth = 3; g.strokeStyle = '#0b0c0d'; g.strokeText(n.t, x, y + r + 13);
        g.fillStyle = n === this.src ? '#f7f8f8' : '#d0d6e0'; g.fillText(n.t, x, y + r + 13);
      }
      g.globalAlpha = 1;
    }
    // burned-in chrome, as a real recording would carry it
    g.textAlign = 'left'; g.font = '500 10px "Geist Mono", monospace'; g.fillStyle = '#8a8f98';
    g.fillText('IMPACT REPLAY · SAME RULE AS THE SIGNAL KERNEL', 12, 18);
    g.textAlign = 'right';
    const reachedNow = this.set.filter(n => arrive(n) <= t).length;
    g.fillText(`${reachedNow} / ${this.set.length} REACHED`, w - 12, 18);
    g.textAlign = 'left';
  }
  seek(t) { this.t = Math.max(0, Math.min(this.dur, t)); this.draw(); this.onTick?.(); }
  play() {
    if (this.t >= this.dur) this.t = 0;
    this.playing = true; let prev = performance.now();
    const step = now => { if (!this.playing) return; this.t = Math.min(this.dur, this.t + (now - prev)); prev = now; this.draw(); this.onTick?.(); if (this.t >= this.dur) { this.playing = false; this.onTick?.(); return; } requestAnimationFrame(step); };
    requestAnimationFrame(step); this.onTick?.();

}
const tc = ms => { const s = ms / 1000; return `${String(Math.floor(s / 60)).padStart(2, '0')}:${(s % 60).toFixed(1).padStart(4, '0')}`; };
const ICON = {
  play: '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.5v11l9.5-5.5z"/></svg>',
  pause: '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M3.5 2.5h3v11h-3zM9.5 2.5h3v11h-3z"/></svg>',
  prev: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 3L5 8l5 5"/></svg>',
  next: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3l5 5-5 5"/></svg>',
  x: '<svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 4l8 8M12 4l-8 8"/></svg>',
  expand: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9.5 2.5h4v4M6.5 13.5h-4v-4M13.5 2.5L9 7M2.5 13.5L7 9"/></svg>',
  pulse: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="2"/><path d="M3.8 3.8a6 6 0 0 0 0 8.4M12.2 3.8a6 6 0 0 1 0 8.4"/></svg>',
};

/** Mount the player controls for a Replay inside `host`. Returns a disposer. */
function mountPlayer(host, node, big) {
  host.innerHTML = `<div class="player"><canvas></canvas></div>
    <div class="strip"><button class="ctl" data-act="play" aria-label="Play replay">${ICON.play}</button>
    <div class="scrub" role="slider" tabindex="0" aria-label="Replay position"><div class="track"></div><div class="fill"></div><div class="knob"></div></div>
    <span class="count" data-tc></span></div><div class="chapter" data-ch></div>`;
  const rp = new Replay(host.querySelector('canvas'), node);
  const scrub = host.querySelector('.scrub'), fill = host.querySelector('.fill'), knob = host.querySelector('.knob'), btn = host.querySelector('[data-act=play]');
  for (const c of rp.chapters.slice(1)) { const i = document.createElement('div'); i.className = 'tick'; i.style.left = `${(c.t / rp.dur) * 100}%`; scrub.appendChild(i); }
  rp.onTick = () => {
    const f = rp.t / rp.dur; fill.style.width = `${f * 100}%`; knob.style.left = `${f * 100}%`;
    host.querySelector('[data-tc]').textContent = `${tc(rp.t)} / ${tc(rp.dur)}`;
    const ch = rp.chapterAt(rp.t); host.querySelector('[data-ch]').innerHTML = `<span class="mono">${tc(ch.t)}</span>  ${esc(ch.label)}`;
    btn.innerHTML = rp.playing ? ICON.pause : ICON.play; btn.setAttribute('aria-label', rp.playing ? 'Pause replay' : 'Play replay');
    scrub.setAttribute('aria-valuenow', Math.round(rp.t)); scrub.setAttribute('aria-valuemax', Math.round(rp.dur));
  };
  btn.onclick = () => rp.playing ? rp.pause() : rp.play();
  const seekFrom = ev => { const r = scrub.getBoundingClientRect(); rp.seek(((ev.clientX - r.left) / r.width) * rp.dur); };
  scrub.addEventListener('pointerdown', ev => { scrub.setPointerCapture(ev.pointerId); rp.pause(); seekFrom(ev); scrub.onpointermove = seekFrom; });
  scrub.addEventListener('pointerup', () => { scrub.onpointermove = null; });
  scrub.addEventListener('keydown', ev => { if (ev.key === 'ArrowRight') rp.seek(rp.t + 500); if (ev.key === 'ArrowLeft') rp.seek(rp.t - 500); if (ev.key === ' ') { ev.preventDefault(); btn.click(); } });
  const ro = new ResizeObserver(() => { rp.size(); rp.draw(); });
  ro.observe(rp.c);
  rp.size(); rp.seek(big ? 0 : rp.lead + rp.HOP * 0.95); // the thumbnail rests on the first hop, like a poster frame
  return { dispose: () => { rp.pause(); ro.disconnect(); }, rp };
}

function mountDeck(host, dom, big) {
  const slides = deckFor(dom);
  let i = 0;
  host.innerHTML = `<div class="${big ? 'presenter' : ''}"><div class="frame slideframe"><div class="scaler"></div></div>
    <div class="strip"><button class="ctl" data-d="-1" aria-label="Previous slide">${ICON.prev}</button><div class="dots"></div><span class="count" data-c></span><button class="ctl" data-d="1" aria-label="Next slide">${ICON.next}</button></div>
    ${big ? '<div class="kbd" style="margin-top:6px">← → to move between slides</div>' : ''}</div>`;
  const frameEl = host.querySelector('.frame'), sc = host.querySelector('.scaler'), dots = host.querySelector('.dots');
  dots.innerHTML = slides.map((_, j) => `<i data-j="${j}" title="Slide ${j + 1}"></i>`).join('');
  const show = j => {
    i = (j + slides.length) % slides.length;
    sc.innerHTML = slides[i];
    host.querySelector('[data-c]').textContent = `${i + 1} / ${slides.length}`;
    dots.querySelectorAll('i').forEach((d, k) => d.classList.toggle('on', k === i));
  };
  const scale = () => { sc.style.transform = `scale(${frameEl.clientWidth / 960})`; };
  host.querySelectorAll('[data-d]').forEach(b => b.onclick = () => show(i + +b.dataset.d));
  dots.onclick = ev => { if (ev.target.dataset.j) show(+ev.target.dataset.j); };
  const key = ev => { if (ev.key === 'ArrowRight') show(i + 1); if (ev.key === 'ArrowLeft') show(i - 1); };
  if (big) addEventListener('keydown', key);
  const ro = new ResizeObserver(scale); ro.observe(frameEl);
  show(0); scale();
  return { dispose: () => { ro.disconnect(); removeEventListener('keydown', key); } };
}

function mountPage(host, n, big) {
  if (big) {
    const margin = n.notes.length
      ? n.notes.map(([to, text]) => `<div class="note"><b>→ ${esc(byId.get(to)?.t || to)}</b>${inline(text)}</div>`).join('')
      : '<div class="quiet">No relation notes on this page.</div>';
    host.innerHTML = `<div class="docwrap"><div class="paperframe-big">${renderPaper(n).replace(/<div class="notes">[\s\S]*?<\/ol><\/div>/, '')}</div><aside class="margin"><h4>Why each relation exists</h4>${margin}</aside></div>`;
    return { dispose() {} };
  }
  host.innerHTML = `<div class="frame paperframe"><div class="scaler">${renderPaper(n)}</div></div>`;
  const frameEl = host.querySelector('.frame'), sc = host.querySelector('.scaler');
  const scale = () => { sc.style.transform = `scale(${frameEl.clientWidth / 640})`; };
  const ro = new ResizeObserver(scale); ro.observe(frameEl); scale();
  return { dispose: () => ro.disconnect() };
}

function tabsFor(n) {
  const r = reach(n);
  const t = [{ id: 'page', label: 'Page' }];
  if (n.k === 'domain') t.push({ id: 'deck', label: 'Deck', n: contents(n).filter(c => c.k === 'capability').length + 3 });
  if (r.order.length > 1) t.push({ id: 'replay', label: 'Replay', n: tc(700 + r.max * 1300 + 1400).replace(/^00:/, '') });
  return t;
}
function mountTab(host, n, id, big) {
  if (id === 'deck') return mountDeck(host, n, big);
  if (id === 'replay') return mountPlayer(host, n, big);
  return mountPage(host, n, big);
}
const tabBar = (tabs, cur) => tabs.map(t => `<button class="tab" role="tab" data-tab="${t.id}" aria-selected="${t.id === cur}">${t.label}${t.n ? ` <span class="n">${t.n}</span>` : ''}</button>`).join('');

// ---------------------------------------------------------------- popover beside the node
let pop = null, popMount = null, popTab = 'page';
function select(n, tab) {
  selected = n; hover = null;
  closePop(true);
  const tabs = tabsFor(n);
  popTab = tab && tabs.some(t => t.id === tab) ? tab : n.k === 'domain' ? 'deck' : 'page';
  pop = document.createElement('div');
  pop.className = 'pop'; pop.setAttribute('role', 'dialog'); pop.setAttribute('aria-label', n.t);
  pop.innerHTML = `<button class="close" aria-label="Close">${ICON.x}</button>
    <header><div class="kind"><b class="${n.k}"></b>${KIND[n.k]}</div><h2>${esc(n.t)}</h2>${n.p ? `<div class="path">${esc(n.p)}</div>` : ''}
    <div class="rev">${n.revs} revision${n.revs === 1 ? '' : 's'} · last <span class="mono">${esc(n.last.h)}</span> on ${esc(n.last.d)}</div></header>
    <div class="tabs" role="tablist">${tabBar(tabs, popTab)}</div><div class="tabbody" role="tabpanel"></div>
    <footer><button class="btn primary" data-act="pulse">${ICON.pulse}Send a change</button><span class="grow"></span><button class="btn" data-act="expand">${ICON.expand}Open full view</button></footer>`;
  stage.appendChild(pop);
  const body = pop.querySelector('.tabbody');
  popMount = mountTab(body, n, popTab, false);
  pop.querySelector('.close').onclick = () => closePop();
  pop.querySelector('.tabs').onclick = ev => {
    const b = ev.target.closest('[data-tab]'); if (!b) return;
    popTab = b.dataset.tab; pop.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', x === b));
    popMount?.dispose(); popMount = mountTab(body, n, popTab, false);
  };
  pop.querySelector('[data-act=pulse]').onclick = () => fire(n);
  pop.querySelector('[data-act=expand]').onclick = () => openViewer(n, popTab);
  placePop(true);
  fire(n, { strength: 0.7, cap: 40 });
}
function closePop(keepSel) {
  popMount?.dispose(); popMount = null;
  pop?.remove(); pop = null;
  if (!keepSel) selected = null;
}
function placePop(first) {
  if (!pop || !selected || innerWidth <= 640) return;
  const x = sx(selected.x), y = sy(selected.y), pw = pop.offsetWidth, ph = pop.offsetHeight, gap = R(selected) * cam.k + 18;
  const right = x + gap + pw <= W - 12 || x < W / 2;
  let left = right ? x + gap : x - gap - pw;
  left = Math.max(12, Math.min(W - pw - 12, left));
  const top = Math.max(12, Math.min(H - ph - 12, y - 64));
  pop.style.left = `${left}px`; pop.style.top = `${top}px`;
  if (first) { pop.style.setProperty('--ox', `${right ? 0 : pw}px`); pop.style.setProperty('--oy', `${y - top}px`); }
}

// ---------------------------------------------------------------- full view (explicit action)
let viewer = null, viewMount = null, lastFocus = null;
function openViewer(n, tab) {
  lastFocus = document.activeElement;
  const tabs = tabsFor(n);
  viewer = document.createElement('div');
  viewer.className = 'scrim';
  viewer.innerHTML = `<div class="viewer" role="dialog" aria-modal="true" aria-label="${esc(n.t)}"><div class="vhead"><div class="kind"><b class="${n.k}"></b>${KIND[n.k]}</div><h2>${esc(n.t)}</h2>
    <div class="tabs" role="tablist">${tabBar(tabs, tab)}</div><button class="close" aria-label="Close full view">${ICON.x}</button></div><div class="vbody"></div></div>`;
  document.body.appendChild(viewer);
  const body = viewer.querySelector('.vbody');
  viewMount = mountTab(body, n, tab, true);
  viewer.querySelector('.tabs').onclick = ev => {
    const b = ev.target.closest('[data-tab]'); if (!b) return;
    viewer.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', x === b));
    viewMount?.dispose(); viewMount = mountTab(body, n, b.dataset.tab, true);
  };
  viewer.querySelector('.close').onclick = closeViewer;
  viewer.addEventListener('pointerdown', ev => { if (ev.target === viewer) closeViewer(); });
  viewer.querySelector('.close').focus();
}
function closeViewer() { viewMount?.dispose(); viewMount = null; viewer?.remove(); viewer = null; lastFocus?.focus?.(); }
addEventListener('keydown', ev => { if (ev.key === 'Escape') { if (viewer) closeViewer(); else if (pop) closePop(); } });

// ---------------------------------------------------------------- find
const dl = $('#concepts');
dl.innerHTML = nodes.slice().sort((a, b) => a.t.localeCompare(b.t)).map(n => `<option value="${esc(n.t)}">${KIND[n.k]}</option>`).join('');
$('#find').addEventListener('change', ev => {
  const n = nodes.find(x => x.t.toLowerCase() === ev.target.value.trim().toLowerCase());
  if (n) { focusNode(n); select(n); ev.target.blur(); }
});

// ---------------------------------------------------------------- history transport (real commits)
const commits = D.commits;
const tl = $('#timeline'), cap = $('#caption');
const times = commits.map(c => +new Date(c.d));
const T0 = Math.min(...times), T1 = Math.max(...times);
const xOf = t => 1 + ((t - T0) / (T1 - T0)) * 98;
tl.setAttribute('aria-valuemax', commits.length);
commits.forEach((c, i) => {
  const el = document.createElement('div');
  el.className = 't'; el.style.left = `${xOf(times[i])}%`; el.style.height = `${6 + Math.min(12, c.n.length * 1.4)}px`;
  el.title = `${c.h} · ${c.d.slice(0, 10)} · ${c.s}`;
  tl.appendChild(el);
});
for (const t of [T0, (T0 + T1) / 2, T1]) {
  const l = document.createElement('div'); l.className = 'lab'; l.style.left = `${xOf(t)}%`;
  l.textContent = new Date(t).toISOString().slice(0, 10); tl.appendChild(l);
}
const ticks = [...tl.querySelectorAll('.t')];
let cur = commits.length - 1, playing = false, timer = null;
function showCommit(i, { wave = true } = {}) {
  cur = i;
  const c = commits[i];
  ticks.forEach((t, j) => { t.classList.toggle('done', j < i); t.classList.toggle('cur', j === i); });
  tl.setAttribute('aria-valuenow', i + 1); tl.setAttribute('aria-valuetext', `Change ${i + 1} of ${commits.length}: ${c.s}`);
  cap.innerHTML = `<span class="h">${esc(c.h.slice(0, 7))}</span><span class="d">${esc(c.d.slice(0, 10))}</span><span class="s">${esc(c.s)}</span><span class="n">${c.n.length} page${c.n.length === 1 ? '' : 's'} · ${i + 1}/${commits.length}</span>`;
  if (!wave) return;
  const srcs = c.n.map(s => byId.get(s)).filter(Boolean);
  srcs.forEach((n, k) => { n.touch = 1; fire(n, { delay: Math.min(900, k * 40), strength: srcs.length > 8 ? 0.75 : 1, cap: Math.max(8, Math.round(160 / srcs.length)) }); });
}
function setPlaying(on) {
  playing = on; clearTimeout(timer);
  $('#playIcon').innerHTML = on ? '<path d="M3.5 2.5h3v11h-3zM9.5 2.5h3v11h-3z"/>' : '<path d="M4 2.5v11l9.5-5.5z"/>';
  $('#play').setAttribute('aria-label', on ? 'Pause the change history' : 'Play the change history');
  if (!on) return;
  const step = () => { if (!playing) return; if (cur >= commits.length - 1) { setPlaying(false); return; } showCommit(cur + 1); timer = setTimeout(step, 2100); };
  if (cur >= commits.length - 1) { cur = -1; }
  step();
}
$('#play').onclick = () => setPlaying(!playing);
function commitAtX(clientX) {
  const r = tl.getBoundingClientRect(), f = ((clientX - r.left) / r.width) * 100;
  let best = 0, bd = Infinity; times.forEach((t, i) => { const d = Math.abs(xOf(t) - f); if (d < bd) { bd = d; best = i; } });
  return best;
}
tl.addEventListener('pointerdown', ev => { setPlaying(false); showCommit(commitAtX(ev.clientX)); });
tl.addEventListener('keydown', ev => {
  if (ev.key === 'ArrowRight' && cur < commits.length - 1) { setPlaying(false); showCommit(cur + 1); }
  if (ev.key === 'ArrowLeft' && cur > 0) { setPlaying(false); showCommit(cur - 1); }
});

// ---------------------------------------------------------------- boot
$('#stats').textContent = `${nodes.length} concepts · ${edges.length} relations · ${commits.length} recorded changes · this repository`;
resize();
Object.assign(cam, fit());
new ResizeObserver(() => { resize(); }).observe(stage);
requestAnimationFrame(t => { last = t; frame(t); });
showCommit(commits.length - 1, { wave: false });
// Open in a working state: the most-revised capability, its real page beside it, and the
// latest recorded change travelling through the map.
setTimeout(() => {
  showCommit(commits.length - 1);
  if (innerWidth > 640) {
    const start = nodes.filter(n => n.k === 'capability').sort((a, b) => b.revs - a.revs)[0];
    focusNode(start); select(start);
  }
}, REDUCED ? 0 : 500);
})();
</script>
